services:
  api:
    build:
      context: .
      dockerfile: src/EasyLotteryAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Directory: /data
      Admin__Email: ${EASYLOTTERY_ADMIN_EMAIL:?EASYLOTTERY_ADMIN_EMAIL must be set}
      Admin__Passkey__RpId: ${EASYLOTTERY_PASSKEY_RP_ID:?EASYLOTTERY_PASSKEY_RP_ID must be set}
      Admin__Passkey__Origins__0: ${EASYLOTTERY_PASSKEY_ORIGIN:?EASYLOTTERY_PASSKEY_ORIGIN must be set}
    ports:
      - "127.0.0.1:${EASYLOTTERY_PORT:-18930}:18930"
    volumes:
      - easy_lottery_data:/data

volumes:
  easy_lottery_data:
