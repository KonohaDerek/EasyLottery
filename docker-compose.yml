services:
  api:
    build:
      context: .
      dockerfile: src/EasyLotteryAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Directory: /data
      Admin__Email: ${EASYLOTTERY_ADMIN_EMAIL:-admin@example.com}
      Admin__Passkey__RpId: ${EASYLOTTERY_PASSKEY_RP_ID:-localhost}
      Admin__Passkey__Origins__0: ${EASYLOTTERY_PASSKEY_ORIGIN:-http://localhost:18930}
    ports:
      - "18930:18930"
    volumes:
      - easy_lottery_data:/data

volumes:
  easy_lottery_data:
