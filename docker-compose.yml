services:
  api:
    build:
      context: .
      dockerfile: src/EasyLotteryAPI/Dockerfile
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:18930
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      Storage__Directory: /data
    ports:
      - "18930:18930"
    volumes:
      - .:/workspace:cached
      - easy_lottery_data:/data
    command: >
      dotnet watch --non-interactive run --project src/EasyLotteryAPI/EasyLotteryApi.csproj --launch-profile EasyLotteryAPI

volumes:
  easy_lottery_data:
