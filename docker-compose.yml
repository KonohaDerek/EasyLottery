services:
  api:
    build:
      context: .
      dockerfile: src/EasyLotteryAPI/Dockerfile
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:18930
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      Storage__Directory: /data
      Settings__AdminToken: ${EASYLOTTERY_ADMIN_TOKEN:-change-this-before-production}
    ports:
      - "18930:18930"
    volumes:
      - .:/workspace:cached
      - easy_lottery_data:/data
    command: >
      dotnet watch --non-interactive run --project src/EasyLotteryAPI/EasyLotteryApi.csproj --no-launch-profile

volumes:
  easy_lottery_data:
