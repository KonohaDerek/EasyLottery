<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/configStorage.js"></script>
    <script>
        (() => {
            let overlayClockFrame = 0;
            let overlayClockLastTick = 0;

            function makeTransparent() {
                for (const element of [document.documentElement, document.body, document.getElementById("app")]) {
                    if (!element) continue;
                    element.style.setProperty("background", "transparent", "important");
                    element.style.setProperty("background-color", "transparent", "important");
                    element.style.setProperty("background-image", "none", "important");
                }
            }

            function syncOvertimeProgress() {
                const panel = document.getElementById("overtime-progress-panel");
                if (!panel) return;

                const start = Number(panel.dataset.startMs || 0);
                const end = Number(panel.dataset.endMs || 0);
                if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return;

                const paused = panel.dataset.isPaused === "true";
                const pausedAt = Number(panel.dataset.pausedAtMs || 0);
                const now = paused && pausedAt > 0 ? pausedAt : Date.now();
                const progress = Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));
                const remainingMs = Math.max(0, end - now);
                const remainingSeconds = Math.floor(remainingMs / 1000);
                const hours = Math.floor(remainingSeconds / 3600);
                const minutes = Math.floor((remainingSeconds % 3600) / 60);
                const seconds = remainingSeconds % 60;

                const fill = document.getElementById("overtime-progress-fill");
                const value = document.getElementById("overtime-progress-value");
                const remaining = document.getElementById("overtime-remaining-time");
                if (fill) fill.style.width = `${progress.toFixed(4)}%`;
                if (value) value.textContent = `${progress.toFixed(2)}%`;
                if (remaining) {
                    remaining.textContent = `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
                }
            }

            window.easyLotteryObs = {
                startOverlayClock: () => {
                    cancelAnimationFrame(overlayClockFrame);
                    overlayClockLastTick = 0;
                    makeTransparent();

                    const tick = (now) => {
                        if (now - overlayClockLastTick >= 50) {
                            overlayClockLastTick = now;
                            syncOvertimeProgress();
                        }
                        overlayClockFrame = requestAnimationFrame(tick);
                    };

                    overlayClockFrame = requestAnimationFrame(tick);
                },
                stopOverlayClock: () => cancelAnimationFrame(overlayClockFrame)
            };
        })();
    </script>
    <script>
        window.easyLotteryMail = {
            send: async (request) => {
                const response = await fetch("/api/result-notification", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify(request)
                });

                if (!response.ok) {
                    throw new Error(`Unable to send result notification (${response.status}).`);
                }
            }
        };
    </script>
    <script>
        (() => {
            if (window.easyLotteryAudio) {
                return;
            }

            const audioContextFactory = () => {
                const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
                return AudioContextCtor ? new AudioContextCtor() : null;
            };

            let audioContext = null;

            function ensureAudioContext() {
                if (!audioContext) {
                    audioContext = audioContextFactory();
                }

                return audioContext;
            }

            function parseToneCue(cue) {
                const parts = String(cue || "").split(":");
                if (parts.length < 4 || parts[0] !== "tone") {
                    return null;
                }

                return {
                    frequency: Number(parts[1]) || 440,
                    durationMs: Number(parts[2]) || 180,
                    waveType: parts[3] || "sine"
                };
            }

            async function playToneCue(cue) {
                const parsed = parseToneCue(cue);
                if (!parsed) {
                    return;
                }

                const context = ensureAudioContext();
                if (!context) {
                    return;
                }

                if (context.state === "suspended") {
                    try {
                        await context.resume();
                    } catch {
                        return;
                    }
                }

                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.type = parsed.waveType;
                oscillator.frequency.value = parsed.frequency;
                gain.gain.setValueAtTime(0.0001, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.12, context.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + parsed.durationMs / 1000);
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.start();
                oscillator.stop(context.currentTime + parsed.durationMs / 1000);
            }

            window.easyLotteryAudio = {
                playCue: async (cue) => {
                    await playToneCue(cue);
                }
            };
        })();
    </script>
    <script>
        (() => {
            if (window.easyLotteryDom) {
                return;
            }

            window.easyLotteryDom = {
                getValue: (selector) => {
                    const element = document.querySelector(selector);
                    return element && typeof element.value === "string" ? element.value : "";
                }
            };
        })();
    </script>
    <script>
        (() => {
            if (window.easyLotteryOvertimeFeed) {
                return;
            }

            const storageKey = "easy-lottery.overtime-feed";
            const remoteFeedUrl = "/easy-lottery-overtime-feed.json";
            let nextRemoteAttemptAt = 0;

            function getSafeContent(content) {
                return content == null ? "[]" : String(content);
            }

            async function readRemoteFeed() {
                const now = Date.now();
                if (now < nextRemoteAttemptAt) {
                    return "";
                }

                try {
                    const response = await fetch(remoteFeedUrl, { cache: "no-store", mode: "cors" });
                    if (response.ok) {
                        nextRemoteAttemptAt = 0;
                        return getSafeContent(await response.text());
                    }
                } catch {
                }

                nextRemoteAttemptAt = now + 30_000;

                return "";
            }

            function readLocalStorage() {
                try {
                    return getSafeContent(window.localStorage.getItem(storageKey));
                } catch {
                    return "[]";
                }
            }

            async function writeRemoteFeed(content) {
                try {
                    await fetch(remoteFeedUrl, {
                        method: "PUT",
                        cache: "no-store",
                        mode: "cors",
                        headers: {
                            "Content-Type": "application/json; charset=utf-8"
                        },
                        body: getSafeContent(content)
                    });
                } catch {
                }
            }

            function writeLocalStorage(content) {
                try {
                    window.localStorage.setItem(storageKey, getSafeContent(content));
                } catch {
                }
            }

            window.easyLotteryOvertimeFeed = {
                read: async () => {
                    const remote = await readRemoteFeed();
                    if (remote) {
                        writeLocalStorage(remote);
                        return remote;
                    }

                    return readLocalStorage();
                },
                write: async (content) => {
                    const safeContent = getSafeContent(content);
                    writeLocalStorage(safeContent);

                    await writeRemoteFeed(safeContent);
                },
                clear: async () => {
                    writeLocalStorage("[]");

                    try {
                        await fetch(remoteFeedUrl, {
                            method: "DELETE",
                            cache: "no-store",
                            mode: "cors"
                        });
                    } catch {
                    }
                }
            };
        })();
    </script>
    <script>
        window.easyLotteryDownload = {
            downloadText: (fileName, content, mimeType) => {
                const safeFileName = fileName || "download.txt";
                const safeContent = content == null ? "" : content;
                const blob = new Blob([safeContent], { type: mimeType || "text/plain;charset=utf-8" });
                const url = URL.createObjectURL(blob);

                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = safeFileName;
                anchor.rel = "noopener";
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                URL.revokeObjectURL(url);
            }
        };
    </script>
    <script>
        (() => {
            const storageKey = "easy-lottery.visual-style";
            const root = document.documentElement;

            function applyThemeKey(key) {
                const safeKey = key === "arcade-neon" ? "dashboard-console" : (key || "dashboard-console");
                root.dataset.visualStyle = safeKey;

                if (document.body) {
                    document.body.dataset.visualStyle = safeKey;
                }

                try {
                    window.localStorage.setItem(storageKey, safeKey);
                } catch {
                }
            }

            let storedKey = "dashboard-console";
            try {
                storedKey = window.localStorage.getItem(storageKey) || storedKey;
            } catch {
            }

            if (storedKey === "arcade-neon") {
                storedKey = "dashboard-console";
            }

            applyThemeKey(storedKey);

            window.easyLotteryTheme = {
                apply: (key) => applyThemeKey(key),
                getStoredKey: () => {
                    try {
                        return window.localStorage.getItem(storageKey) || "";
                    } catch {
                        return "";
                    }
                }
            };
        })();
    </script>
    <script>
        window.easyLotteryClipboard = {
            copyText: async (text) => {
                const safeText = text == null ? "" : String(text);

                if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
                    await navigator.clipboard.writeText(safeText);
                    return;
                }

                const textarea = document.createElement("textarea");
                textarea.value = safeText;
                textarea.setAttribute("readonly", "true");
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }
        };
    </script>
