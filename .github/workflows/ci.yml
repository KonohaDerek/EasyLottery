name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EasyLottery.generated.sln

      - name: Build
        run: dotnet build EasyLottery.generated.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EasyLottery.generated.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
